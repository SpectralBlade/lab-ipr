apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-messager-uploads
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ch.ctrox.csi.s3-driver
    volumeHandle: messager-uploads
    volumeAttributes:
      bucketName: messager-uploads
      mounter: s3fs
      endpoint: http://minio.messager.svc.cluster.local:9000
    nodeStageSecretRef:
      name: minio-secret
      namespace: messager
    nodePublishSecretRef:
      name: minio-secret
      namespace: messager
  mountOptions:
    - url=http://minio.messager.svc.cluster.local:9000
    - use_path_request_style
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: message-uploads-pvc
  namespace: messager
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: s3-pv-messager-uploads