apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s3-storage
provisioner: ch.ctrox.csi.s3-driver
parameters:
  mounter: rclone
  bucket: messager-uploads
  csi.storage.k8s.io/provisioner-secret-name: minio-secret
  csi.storage.k8s.io/provisioner-secret-namespace: messager
  csi.storage.k8s.io/node-publish-secret-name: minio-secret
  csi.storage.k8s.io/node-publish-secret-namespace: messager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: message-uploads-pvc
  namespace: messager
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: s3-storage
  resources:
    requests:
      storage: 10Gi