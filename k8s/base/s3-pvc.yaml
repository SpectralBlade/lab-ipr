apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-messager-uploads
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ch.ctrox.csi.s3-driver
    volumeHandle: s3-volume-messager
    volumeAttributes:
      bucketName: messager-uploads
      mounter: rclone
    nodeStageSecretRef:
      name: minio-secret
      namespace: messager
    nodePublishSecretRef:
      name: minio-secret
      namespace: messager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: message-uploads-pvc
  namespace: messager
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: s3-pv-messager-uploads